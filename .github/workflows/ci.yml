name: Dashboard CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    WALLET_API_URL: https://ci.example.invalid

jobs:
    quality:
        name: Lint, tipos, testes e build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v5

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint with ESLint
              run: npm run lint

            - name: Check types
              run: npm run typecheck

            - name: Tests
              run: npm test

            - name: Build
              run: npm run build
